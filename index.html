<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="azulejos" src="textura_suelo.jpeg">
        <img id="fondo" src="descarga.jpg">
      </a-assets>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-box position="1 2 -3" rotation="0 45 0" color="lightblue"></a-box>

      <a-box position="0 1.5 -7" width="4" height="3"depth="0.2"color="white"></a-box>
      <a-box position="0 1.5 -3" width="4" height="3" depth="0.2" color="white"></a-box>
      <a-box position="-2 1.5 -5" width="0.2" height="3" depth="4" color="white"></a-box> 
      <a-box position="2 1.5 -5"  width="0.2"  height="3"  depth="4"  color="white"></a-box> </a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" src="#azulejos"></a-plane>
      <a-sky src="#fondo"></a-sky>
    </a-scene>
  </body>
</html>
