<html>

  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

  </head>

  <body>
    <a-scene xr-mode-ui="XRMode: xr">

      <a-entity position="5 1.6 0" rotation="0 0 0">
      <a-camera wasd-controls="aceleration: 100; fly: true"
       look-controls></a-camera></a-entity>

      <a-entity movement-controls="fly: true" position="5 1.6 0"  rotation="0 0 0"> 
      <a-camera wasd-controls="aceleration: 100; fly: true" look-controls ></a-camera>
      <a-entity oculus-touch-controls="hand: right"></a-entity>
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      </a-entity>
   
    <a-assets>
      <img id="fondo" src="cielo.jpeg">
      <img id="sol" src="sol.jpeg">
      <img id="mercurio_fondo" src="mercurio.jpeg">
      <img id="venus_fondo"  src="venus.jpeg">
      <img id="tierra_fondo" src="tierra.jpeg">
     </a-assets>

    <a-sphere position="0 1.25 -1" radius="3" src="#sol"
    animation="property: rotation; to: 0 360 0; dur: 10000;easing: linear; 
    loop: true; dir: normal"></a-sphere>
    
      <a-sphere position="0 1.25 -6" radius="0.75" src="#mercurio_fondo"
      animation="property: rotation; to: 0 360 0; dur: 2000;easing: linear; 
    loop: true; dir: normal"></a-sphere>

      <a-sphere position="0 1.25 -10" radius="1.5" src="#venus_fondo"
      animation="property: rotation; to: 0 360 0; dur: 12000;easing: linear; 
    loop: true; dir: normal"></a-sphere>

      <a-sphere position="0 1.25 -15" radius="1.75" src="#tierra_fondo"
      animation="property: rotation; to: 0 360 0; dur: 8000;easing: linear; 
    loop: true; dir: normal">
      <a-sphere position="2 2 -15" radius="0.25" color="white"></a-sphere></a-sphere>

      <a-sphere position="0 1.25 -20" radius="2" color="#B7410E"
      animation="property: rotation; to: 0 360 0; dur: 13000;easing: linear; 
    loop: true; dir: normal"></a-sphere>
      
<a-sky hide-on-enter-ar src="#fondo"></a-sky>
  </a-scene>
  </body>

</html>
